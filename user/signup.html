<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/login.css">

</head>

<body>
    <div class="page">
        <header class="page-header">
            <a class="brand" href="../homepage.html">reCooked</a>
            <h1>Sign up</h1>
            <a class="header-action" href="login.html">Login</a>
        </header>
        <main class="content">
            <form class="form-card">
                <h2 class="page-title">Create account</h2>
                <label for="name">Name</label>
                <input id="name" type="text" autocomplete="name">
                <label for="signup-email">Email</label>
                <input id="signup-email" type="email" autocomplete="email">
                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" autocomplete="new-password">
                <button class="button" type="submit">Sign up</button>
            </form>
        </main>
        <footer class="site-footer"><a href="../homepage.html">Home</a><span>reCooked © 2026</span></footer>
    </div>
</body>
</html>
