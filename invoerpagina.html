<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoer Pagina</title>
    <link rel="stylesheet" href="/css/invoerstyle.css">

</head>

<body>
    <div class="page">
        <header class="page-header">
            <a class="brand" href="homepage.html">reCooked</a>
            <h1>Add a recipe</h1>
            <a class="header-action" href="user/login.html">Login / sign up</a>
        </header>
        <main class="content">
            <form class="form-card">
                <h2 class="page-title">Share your recipe</h2>
                <label for="recipe-name">Recipe name</label>
                <input id="recipe-name" type="text" placeholder="Give it a name">
                <label for="category">Category</label>
                <select id="category"><option>Pasta</option><option>Dessert</option><option>Other</option></select>
                <label for="ingredients">Ingredients and method</label>
                <textarea id="ingredients" placeholder="Write your recipe here"></textarea>
                <button class="button" type="submit">Add recipe</button>
            </form>
        </main>
        <footer class="site-footer"><a href="homepage.html">Home</a><span>reCooked © 2026</span></footer>
    </div>
</body>
</html>
