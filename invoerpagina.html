<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Add a recipe | reCooked</title>
	<link rel="stylesheet" href="css/invoerstyle.css">
	<link rel="stylesheet" href="css/auth.css">
</head>
<body>
	<header class="recipe-header">
		<a href="homepage.html">reCooked</a>
		<a class="auth-link" href="user/login.html">Login / sign up</a>
	</header>

	<main class="recipe-form-page">
		<h1>Add your recipe</h1>
		<p>Share a recipe with the reCooked community.</p>

		<form class="recipe-form" action="actions/create_recipe.php" method="post">
			<label for="title">Recipe name</label>
			<input id="title" name="title" type="text" maxlength="100" required>

			<label for="category">Category</label>
			<select id="category" name="category" required>
				<option value="">Choose a category</option>
				<option value="pasta">Pasta</option>
				<option value="desserts">Desserts</option>
				<option value="other">Other recipes</option>
			</select>

			<label for="difficulty">Difficulty</label>
			<select id="difficulty" name="difficulty" required>
				<option value="">Choose a difficulty</option>
				<option value="Easy">Easy</option>
				<option value="Medium">Medium</option>
				<option value="Hard">Hard</option>
			</select>

			<label for="prep_time">Preparation time (minutes)</label>
			<input id="prep_time" name="prep_time" type="number" min="1" max="1440" required>

			<label for="description">Description</label>
			<textarea id="description" name="description" rows="4" required></textarea>

			<label for="ingredients">Ingredients</label>
			<textarea id="ingredients" name="ingredients" rows="7" aria-describedby="ingredients-help" placeholder="200 g pasta&#10;2 tomatoes&#10;Salt to taste" required></textarea>
			<small id="ingredients-help">Put one ingredient on each line. Include the amount and unit on that line if needed.</small>

			<label for="image_path">Recipe image path</label>
			<input id="image_path" name="image_path" type="text" maxlength="255" placeholder="imgrecooked/pasta/my-recipe.png" required>
			<small>Enter a path to an image file already in the project, relative to the project root.</small>

			<button type="submit">Upload recipe</button>
		</form>
	</main>

	<script src="js/auth.js" data-endpoint="actions/current_user.php"></script>
	<script src="js/add.js" data-auth-endpoint="actions/current_user.php"></script>
</body>
</html>
